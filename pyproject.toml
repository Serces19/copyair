[project]
name = "copyair"
version = "0.2.0"
description = "Core Engine for Few-Shot Image-to-Image Translation, VFX Restoration & De-aging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchmetrics>=1.2.0",
    "timm>=0.9.12",
    "transformers>=4.36.0",
    "einops>=0.7.0",
    "albumentations>=1.3.1",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "dreamsim>=0.2.1",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.17.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "kagglehub>=0.2.0",
    "mlflow>=2.9.0",
    "wandb>=0.16.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "pytest>=7.4.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
