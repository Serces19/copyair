data:
  input_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/deaging/input
  gt_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/deaging/gt
  frames_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/deaging/extracted_frames
  output_dir: output_inference/deaging
  models_dir: models

model:
  architecture: nafnet
  size: base
  in_channels: 3
  out_channels: 3
  dropout_p: 0.05

training:
  epochs: 1000
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 1e-4
  mixed_precision: true
  gradient_accumulation_steps: 1
  clear_cache_every_n_epochs: 10
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: cosine
    params:
      T_max: 1000
      eta_min: 1e-6
  val_split: 0
  val_interval: 50
  val_samples: 4
  viz_interval: 100
  save_interval: 250
  early_stopping_patience: 500

loss:
  lambda_charbonnier: 0.2
  lambda_perceptual: 0.8
  lambda_dino: 0.2
  lambda_laplacian: 0.1
  lambda_ssim: 0.0

augmentation:
  enabled: true
  img_size: 512
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.0
  rotation_limit: 10
  gaussian_noise_p: 0.0
  gaussian_blur_p: 0.05
  color_jitter_p: 0.05

device: cuda
num_workers: 0
pin_memory: true

logging:
  level: INFO
  log_dir: logs

mlflow:
  enabled: true
  experiment_name: copyair_deaging_nafnet
  tracking_uri: sqlite:///mlflow.db

inference:
  target_fps: 24
  frame_sample_rate: 1
