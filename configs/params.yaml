data:
  input_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/wireremoval/input
  gt_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/wireremoval/gt
  frames_dir: K:/Estudios/Maestria Machine Learning/Tesis/datasets/wireremoval/extracted_frames
  output_dir: output_inference/wireremoval
  models_dir: models

model:
  architecture: nafnet
  size: base
  in_channels: 3
  out_channels: 3
  dropout_p: 0.0

training:
  epochs: 1500
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 1e-4
  mixed_precision: true
  gradient_accumulation_steps: 1
  clear_cache_every_n_epochs: 10
  optimizer:
    type: schedule_free_adamw
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: none
  val_split: 0
  val_interval: 50
  val_samples: 4
  viz_interval: 100
  save_interval: 250
  early_stopping_patience: 1000

loss:
  lambda_charbonnier: 1.0
  lambda_perceptual: 0.8
  lambda_dino: 0.1
  lambda_ssim: 0.0

augmentation:
  enabled: true
  img_size: 512
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.0
  rotation_limit: 0

device: cuda
num_workers: 0
pin_memory: true

logging:
  level: INFO
  log_dir: logs

mlflow:
  enabled: true
  experiment_name: copyair_wireremoval_nafnet
  tracking_uri: sqlite:///mlflow.db

inference:
  target_fps: 24
  frame_sample_rate: 1
